<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="shortcut icon" type="image/svg+xml" href="/logo.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#EDF0F8" />
        <title>哪吒监控 Nezha Monitoring</title>
        <script>
            (() => {
                let theme = "system"
                try { theme = localStorage.getItem("vite-ui-theme") || theme } catch {}
                const dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches)
                document.documentElement.classList.add(dark ? "dark" : "light")
                document.documentElement.style.backgroundColor = dark ? "#070B14" : "#EDF0F8"
                document.querySelector('meta[name="theme-color"]').content = dark ? "#070B14" : "#EDF0F8"
            })()
        </script>
    </head>

    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
